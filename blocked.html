<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Time's up</title>
<style>
  :root {
    --ink: #14161c;
    --gold: #e8b45a;
    --text: #eceef2;
    --text-dim: #8b90a0;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card { text-align: center; max-width: 440px; padding: 40px; }
  .mark { font-size: 48px; color: var(--gold); margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  .site-name { color: var(--gold); font-weight: 600; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    background: none;
    border: 1px solid #2a2e3a;
    color: var(--text);
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #snooze-note { font-size: 11px; margin-top: 14px; color: var(--text-dim); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">◐</div>
    <h1>You've hit today's limit</h1>
    <p>
      Your <span id="limit-min"></span> minute daily budget for
      <span class="site-name" id="site-name"></span> is used up.
      It resets automatically — go do something else with the time.
    </p>
    <div class="actions">
      <button id="back-btn">Go back</button>
      <button id="snooze-btn">Snooze 5 more minutes</button>
    </div>
    <p id="snooze-note"></p>
  </div>
  <script src="lib.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
